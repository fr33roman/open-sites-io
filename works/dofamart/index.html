:root{
  color-scheme: dark;
  --a1:#FF2BD6; --a2:#22E4FF; --a3:#FFE14D; --bg:#07021A;
  --fg:#F6F3FF; --mute:#B9B2D3; --dim:#8D86A8;
  --line:rgba(255,255,255,.12); --line-2:rgba(255,255,255,.22);
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.11);
  --panel:color-mix(in srgb, var(--bg) 78%, #2b2150);
  --panel-2:color-mix(in srgb, var(--bg) 62%, #3a2d68);
  --paper:#F4F0E6; --paper-ink:#1E1B26; --paper-line:#CFC8B8;
  --ok:#3BF0A0; --warn:#FF4D6D; --white:#FFFFFF; --black:#07060C;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --f-emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  --r-s:10px; --r-m:18px; --r-l:26px;
  --grad:linear-gradient(100deg,var(--a1),var(--a2));
  --grad-3:linear-gradient(100deg,var(--a3),var(--a1) 45%,var(--a2));
  --glow:0 0 0 1px color-mix(in srgb,var(--a1) 50%,transparent),0 18px 60px -18px color-mix(in srgb,var(--a1) 70%,transparent);
}
*,*::before,*::after{box-sizing:border-box}

.logo{min-height:44px}

.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;filter:grayscale(.4)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:140px;background:var(--bg)}

.hdr-row{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;color:var(--fg);font:900 21px/1 var(--f-display);letter-spacing:-.04em;cursor:pointer}

.dopa-lbl{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}

.dopa-bar{height:7px;border-radius:4px;background:var(--glass-2);overflow:hidden}
.dopa-bar span{display:block;height:100%;width:0;background:var(--grad-3);box-shadow:0 0 12px var(--a1);transition:width .7s}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:14px;font:700 15px/1.1 var(--f-body);transition:transform .15s,box-shadow .2s,background .2s;text-align:center}

.hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:48px;align-items:center;padding-block:clamp(48px,9vh,110px) clamp(56px,10vh,120px)}

.ord{border:1px solid var(--line);background:var(--glass);border-radius:18px;padding:16px;display:grid;gap:12px;margin-top:14px}

.ord-items{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

.ord-sum{margin-left:auto;font:800 14px var(--f-mono)}
.route{position:relative;height:40px;margin:2px 16px}

.route .prog{position:absolute;left:0;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:var(--grad);box-shadow:0 0 12px var(--a1);transition:width 1s linear}
.route .cour{position:absolute;top:50%;font-size:26px;transform:translate(-50%,-60%);transition:left 1s linear;filter:drop-shadow(0 0 10px var(--a2))}
.route .a,.route .b{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:20px}
.route .a{left:0}.route .b{left:100%}
.ord-st{display:flex;gap:8px;align-items:flex-start;font-weight:700;font-size:14px}
.ord-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:8px}
.stat{padding:16px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}

.ach.got{border-color:color-mix(in srgb,var(--a3) 50%,transparent)} .ach.got .emo{background:var(--grad-3)}

.cur-g{position:sticky;top:0;z-index:1;background:var(--panel);padding:9px 14px;font:800 11px var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--a2);border-bottom:1px solid var(--line)}

.cur[aria-pressed="true"]{background:color-mix(in srgb,var(--a2) 14%,transparent)}
.cur[aria-pressed="true"] b{color:var(--a2)}
.capc{display:flex;gap:6px;flex-wrap:wrap}
.capc button,.seg button{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--glass);font:700 13px var(--f-mono)}
.capc button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--grad);color:var(--black);border-color:transparent}
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.th-b{display:grid;gap:8px;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--glass);text-align:left;font-weight:700;font-size:12.5px}
.th-b i{display:block;height:34px;border-radius:9px}
.th-b[aria-pressed="true"]{border-color:var(--white);box-shadow:0 0 0 1px var(--white)}
.prow{display:flex;gap:8px 24px;flex-wrap:wrap;align-items:center;margin-top:12px}
.seg{display:inline-flex;gap:4px}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.switch span.k{width:42px;height:24px;border-radius:12px;background:var(--glass-2);border:1px solid var(--line-2);position:relative;transition:background .2s}
.switch span.k::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--white);transition:transform .2s}
.switch[aria-pressed="true"] span.k{background:var(--grad)}
.switch[aria-pressed="true"] span.k::after{transform:translateX(18px)}

.toast{pointer-events:auto;display:flex;gap:12px;align-items:center;padding:12px 16px;border-radius:16px;font-size:14px;font-weight:600;color:var(--fg);
  background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box;border:1px solid transparent;box-shadow:0 16px 40px -12px rgba(0,0,0,.7),0 0 30px -10px var(--a1);animation:tin .35s cubic-bezier(.2,.9,.3,1.3)}

@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes tout{to{opacity:0;transform:translateY(10px)}}
#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:95}
